spring.application.name=TaskFlow

# ── Database ──────────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/scheduler_db
spring.datasource.username=root
spring.datasource.password=hiteja6666!

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ── Quartz ────────────────────────────────────────────────────────────────────
spring.quartz.job-store-type=jdbc
spring.quartz.jdbc.initialize-schema=always
# Prevent Quartz from conflicting with Spring's transaction manager
spring.quartz.properties.org.quartz.jobStore.isClustered=false

# ── JWT ───────────────────────────────────────────────────────────────────────
# IMPORTANT: Secret must be at least 32 characters (256 bits) for HS256
jwt.secret=verysecretkeyverysecretkeyverysecretkeyXXXXXX
jwt.expiration=86400000


